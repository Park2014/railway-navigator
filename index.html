
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철도미래 내비게이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
    {
        "imports": {
            "@google/generative-ai": "https://esm.sh/@google/generative-ai@^1.40.0"
        }
    }
    </script>
</head>
<body class="bg-slate-50">
    <div id="root"></div>
    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // Vercel 환경변수 또는 직접 입력된 키를 사용합니다.
        const API_KEY = "AIzaSyAHrxfhylVxLgnkKvREFA3M7V5PVcygUM0"; 
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        // 여기에 image_5a95f3.jpg의 로직을 웹용으로 변환하여 통합했습니다.
        async function initApp() {
            const root = document.getElementById('root');
            root.innerHTML = `
                <div class="max-w-md mx-auto h-screen flex flex-col bg-white shadow-lg">
                    <header class="bg-blue-600 p-4 text-white text-center font-bold">🚄 철도미래 내비게이터</header>
                    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4 text-sm">
                        <div class="bg-gray-100 p-3 rounded-lg text-gray-700">반갑습니다, 철도대학 학생 여러분! 🎓<br>2025년 철도 산업 트렌드에 대해 무엇이든 물어보세요!</div>
                    </div>
                    <div class="p-4 border-t flex gap-2">
                        <input id="user-input" class="flex-1 border rounded-full px-4 py-2 outline-none text-sm" placeholder="질문을 입력하세요...">
                        <button id="send-btn" class="bg-blue-600 text-white px-4 py-2 rounded-full">전송</button>
                    </div>
                </div>
            `;

            const chatBox = document.getElementById('chat-box');
            const input = document.getElementById('user-input');
            const btn = document.getElementById('send-btn');

            btn.onclick = async () => {
                const text = input.value;
                if(!text) return;
                
                chatBox.innerHTML += `<div class="text-right"><span class="bg-blue-100 p-2 rounded-lg inline-block">${text}</span></div>`;
                input.value = '';
                
                try {
                    const result = await model.generateContent(text);
                    const response = await result.response;
                    chatBox.innerHTML += `<div class="text-left"><span class="bg-gray-100 p-2 rounded-lg inline-block">${response.text()}</span></div>`;
                } catch (e) {
                    chatBox.innerHTML += `<div class="text-center text-red-500 text-xs">연결 오류가 발생했습니다. 키 설정을 확인해주세요.</div>`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            };
        }
        initApp();
    </script>
</body>
</html>
